name: GDB Banking Platform CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-auth-service:latest

      - name: Build and push account-service
        uses: docker/build-push-action@v5
        with:
          context: ./account-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-account-service:latest

      - name: Build and push users-service
        uses: docker/build-push-action@v5
        with:
          context: ./users-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-users-service:latest

      - name: Build and push transactions-service
        uses: docker/build-push-action@v5
        with:
          context: ./transactions-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-transactions-service:latest

      - name: Build and push payment-gateway-service
        uses: docker/build-push-action@v5
        with:
          context: ./payment-gateway-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-payment-gateway-service:latest

      - name: Build and push aadhar-service
        uses: docker/build-push-action@v5
        with:
          context: ./aadhar-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-aadhar-service:latest

      - name: Build and push company-service
        uses: docker/build-push-action@v5
        with:
          context: ./company-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-company-service:latest

      - name: Build and push eureka-server
        uses: docker/build-push-action@v5
        with:
          context: ./eureka-server
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-eureka-server:latest

      - name: Build and push gateway-service
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-gateway-service:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gdb-frontend:latest
