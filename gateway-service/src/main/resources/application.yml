server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/auth/**
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8001}
          predicates:
            - Path=/api/v1/accounts/**
        - id: transactions-service
          uri: ${TRANSACTIONS_SERVICE_URL:http://localhost:8002}
          predicates:
            - Path=/api/v1/transactions/**
        - id: users-service
          uri: ${USERS_SERVICE_URL:http://localhost:8004}
          predicates:
            - Path=/api/v1/users/**
        - id: aadhar-service
          uri: ${AADHAR_SERVICE_URL:http://localhost:8005}
          predicates:
            - Path=/api/v1/aadhar/**
        - id: company-service
          uri: ${COMPANY_SERVICE_URL:http://localhost:8006}
          predicates:
            - Path=/api/v1/company/**
        - id: payment-gateway-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8008}
          predicates:
            - Path=/api/v1/payments/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
