apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: gdb-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: auth-db
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: gdb_auth_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gdb-secrets
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gdb-secrets
                  key: DATABASE_PASSWORD
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: gdb-banking
spec:
  selector:
    app: auth-db
  ports:
    - port: 5432
---
