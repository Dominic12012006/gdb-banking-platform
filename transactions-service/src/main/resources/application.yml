server:
  port: ${PORT:8002}

spring:
  application:
    name: transactions-service
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
  file:
    name: logs/transactions-service.log
    max-size: 10MB
    max-history: 30

# External Service URLs
external:
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8001}
    timeout: 10000
    retry:
      max-attempts: 3
      delay: 1000
  payment-gateway-service:
    url: ${PAYMENT_GATEWAY_SERVICE_URL:http://localhost:8008}
    timeout: 10000

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/docs
    operations-sorter: alpha
    tags-sorter: alpha
  packages-to-scan: com.gdb.transactions.controller
